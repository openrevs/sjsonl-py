[project]
name = "sjsonl"
version = "0.1.0"
description = "Signed JSONL (SJSONL): sign, verify, diff and patch JSON Lines documents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jim Kalafut", email = "jim@kalafut.net" }
]
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42",
]
keywords = ["jsonl", "json-lines", "ed25519", "signature", "diff", "patch", "openrevs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://openrevs.org"
Specification = "https://openrevs.org/specs/sjsonl/"
Source = "https://github.com/openrevs/sjsonl-py"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N"]
ignore = ["PT011", "PT018"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.uv.build-backend]
# Ship tests and vectors in the sdist so downstream packagers can run them.
source-include = ["tests/**"]
